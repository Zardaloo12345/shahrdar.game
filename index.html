<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شهردار | بازی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        
        <!-- سکو و شخصیت‌ها -->
        <div class="scene" id="scene">
            <img src="platform.jpg" alt="سکو" class="platform-img">
            
            <!-- شهردار (وسط) -->
            <img src="mayor.jpg" alt="شهردار" class="char-img mayor" id="mayor-img">
            
            <!-- شهروند (چپ) -->
            <img src="citizen.jpg" alt="شهروند" class="char-img citizen" id="citizen">
            
            <!-- سازنده ۱ (راست) -->
            <img src="builder.jpg" alt="سازنده" class="char-img builder" id="builder1">
            <!-- سازنده ۲ (راست) -->
            <img src="builder.jpg" alt="سازنده" class="char-img builder" id="builder2">

            <!-- محل ساختمان -->
            <div id="building-spot" class="building-spot"></div>
        </div>

        <!-- کنترل‌های پایین -->
        <div class="controls">
            <!-- جوی‌استیک سمت چپ -->
            <div class="joystick-container" id="joystick-container">
                <div class="joystick-base"></div>
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>
            
            <!-- دکمه ساخت سمت راست -->
            <button id="build-btn" class="action-btn">ساخت</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
