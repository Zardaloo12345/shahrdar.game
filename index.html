<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شهردار | بازی استراتژیک شهر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; user-select: none; }
        body {
            background-color: #1a3a5c; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; flex-direction: column; 
        }

        .game-container {
            width: 100%; max-width: 500px; height: 100%; display: flex;
            flex-direction: column; justify-content: space-between; padding-bottom: 20px; position: relative;
        }

        /* نوار بالای صفحه */
        .top-bar {
            position: absolute; top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
            color: white; font-weight: bold; font-size: 14px;
        }
        .profile-info { background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; }
        .profile-info .name { font-size: 14px; color: #f1c40f; }
        .profile-info .id { font-size: 11px; color: #ccc; }
        
        .coin-info { background: #f1c40f; color: #333; padding: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }

        .top-right-buttons { display: flex; gap: 8px; position: absolute; top: 10px; right: 15px; z-index: 10;}
        .icon-btn { background: rgba(0,0,0,0.4); border: none; color: white; font-size: 18px; padding: 5px 8px; border-radius: 50%; cursor: pointer; }

        /* صحنه بازی */
        .scene { width: 100%; height: 55vh; position: relative; display: flex; justify-content: center; align-items: center; margin-top: 40px; overflow: hidden; }

        /* زمین سه بعدی */
        .ground-container {
            position: absolute; width: 90%; max-width: 380px; height: 320px;
            top: 50%; left: 50%; transform: translate(-50%, -50%) perspective(800px) rotateX(45deg);
            transition: transform 0.5s ease, width 0.5s ease, height 0.5s ease;
            z-index: 1; 
            background-color: #e0cda9;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            border: 4px solid #b89b58;
        }

        /* دیوار سنگی */
        .stone-wall {
            position: absolute;
            border: 6px solid #777; border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            display: none; z-index: 3; pointer-events: none;
        }
        .stone-wall.active { display: block; animation: wallAppear 0.5s ease-out; }
        @keyframes wallAppear { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* شبکه ۵x۸ = ۴۰ خانه */
        .grid-container {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(5, 1fr);
            z-index: 2; pointer-events: none;
            gap: 1px; /* فاصله خیلی کم بین خانه‌ها */
            padding: 2px;
        }
        .grid-container.active { pointer-events: all; }

        .grid-cell {
            border: 1px dashed rgba(0,0,0,0.1); 
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .grid-cell:hover { background: rgba(255,255,255,0.2); }
        .grid-cell.selected { background: rgba(76, 175, 80, 0.6); border: 1px solid #4CAF50; }

        /* محتویات خانه‌ها */
        .cell-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .cell-content.grass-cell { background-image: url('grass.jpeg'); background-size: cover; background-position: center; }
        .cell-content.street-cell { background-color: #333; border: 1px solid #555; }

        /* ساختمان‌های سه بعدی */
        .cell-content img.building-img { 
            width: 95%; height: 95%; object-fit: contain; 
            filter: drop-shadow(2px 8px 5px rgba(0,0,0,0.7));
            transform: rotateX(10deg) translateY(-5px);
            transform-origin: bottom center;
            mix-blend-mode: multiply;
            transition: transform 0.3s ease;
        }
        .cell-content img.building-img:hover { transform: rotateX(15deg) translateY(-10px) scale(1.1); z-index: 10; }

        /* شخصیت‌ها */
        .char-img { position: absolute; z-index: 5; mix-blend-mode: multiply; transition: all 0.1s linear; }
        .mayor { width: 45px; bottom: 10%; left: 50%; transform: translateX(-50%); }
        #builder1 { width: 35px; bottom: 10%; right: 35%; }
        #builder2 { width: 35px; bottom: 10%; right: 25%; }

        /* کنترل‌ها */
        .controls { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; }

        .joystick-container {
            width: 80px; height: 80px; position: relative; display: flex;
            justify-content: center; align-items: center; background: rgba(255,255,255,0.1);
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
        }
        .joystick-knob {
            width: 30px; height: 30px; background: rgba(255,255,255,0.5); border-radius: 50%;
            position: absolute; transition: transform 0.1s ease-out;
        }

        .action-btn-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; width: 170px; }
        .action-btn {
            width: 50px; height: 50px; border-radius: 50%; background-color: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.6); color: white; font-size: 20px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .action-btn:active { transform: scale(0.9); }

        /* پنل تعامل با ساختمان */
        .interaction-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9); color: white; padding: 15px; border-radius: 15px;
            width: 90%; max-width: 400px; text-align: center; z-index: 50;
            transition: transform 0.3s ease; display: flex; flex-direction: column; gap: 10px;
        }
        .interaction-panel.active { transform: translateX(-50%) translateY(0); }
        .interaction-title { font-size: 16px; font-weight: bold; color: #f1c40f; margin-bottom: 5px; }
        .interaction-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .int-btn { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; background: #2980b9; }
        .int-btn.danger { background: #c0392b; }
        .int-btn.success { background: #27ae60; }
        .close-panel-btn { background: #555; margin-top: 5px; width: 100%; }

        /* مودال‌ها */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px;
            text-align: center; color: #333; max-height: 80vh; overflow-y: auto;
        }

        .modal-content h2 { margin-bottom: 15px; font-size: 18px; }
        .modal-content p { margin-bottom: 10px; }

        .building-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .building-item {
            width: 100%; aspect-ratio: 1; background: #f0f0f0; border-radius: 10px;
            cursor: pointer; padding: 5px; border: 2px solid transparent; transition: all 0.2s;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold;
        }
        .building-item:hover { border-color: #1a3a5c; background: #e0e0e0; }
        .building-item img { width: 80%; height: 80%; object-fit: contain; }
        .price-tag {
            position: absolute; bottom: 5px; background: #f1c40f; color: #333;
            font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 10px;
        }

        .modal-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-accept { background-color: #4CAF50; }
        .btn-reject { background-color: #f44336; }
        .btn-action { background-color: #2980b9; width: 100%; margin-top: 10px; }

        .profile-form input, .friend-form input, .attack-form input, .rename-form input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center;
        }
        .profile-form button, .rename-form button { width: 100%; padding: 10px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 200;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body id="main-body">
    
    <!-- پروفایل اولیه -->
    <div class="modal-overlay active" id="profile-modal">
        <div class="modal-content profile-form">
            <h2>خوش آمدید، شهردار!</h2>
            <input type="text" id="username-input" placeholder="نام شهردار..." maxlength="15">
            <button id="save-profile-btn">شروع بازی (۱۰۰ سکه)</button>
        </div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="profile-info" id="profile-info">
                <span class="name" id="display-name">شهردار</span>
                <span class="id">ID: <span id="display-id">---</span></span>
            </div>
            <div class="coin-info">🪙 <span id="coin-count">۱۰۰</span></div>
        </div>
        
        <div class="top-right-buttons">
            <button class="icon-btn" id="friends-btn">👥</button>
            <button class="icon-btn" id="attack-btn">⚔️</button>
            <button class="icon-btn" id="daily-btn">🎁</button>
        </div>

        <div class="scene" id="scene">
            <div class="ground-container" id="ground-container">
                <div class="stone-wall" id="stone-wall"></div>
                <div class="grid-container" id="grid-container"></div>
            </div>

            <img src="mayor.jpg" alt="شهردار" class="char-img mayor" id="mayor-img">
            <img src="builder.jpg" alt="سازنده ۱" class="char-img" id="builder1">
            <img src="builder.jpg" alt="سازنده ۲" class="char-img" id="builder2">
        </div>

        <div class="controls">
            <div class="joystick-container" id="joystick-container">
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>
            <div class="action-btn-group">
                <button id="street-btn" class="action-btn">🛣️</button>
                <button id="wall-btn" class="action-btn">🧱</button>
                <button id="land-btn" class="action-btn">🌍</button>
                <button id="grass-btn" class="action-btn">🌿</button>
                <button id="hammer-btn" class="action-btn">🔨</button>
            </div>
        </div>
    </div>

    <!-- پنل تعامل -->
    <div class="interaction-panel" id="interaction-panel">
        <div class="interaction-title" id="int-title">نام ساختمان</div>
        <div class="interaction-buttons" id="int-buttons"></div>
        <button class="int-btn close-panel-btn" id="close-panel-btn">بستن (برگشت)</button>
    </div>

    <!-- مودال انتخاب جنگنده -->
    <div class="modal-overlay" id="fighter-modal">
        <div class="modal-content">
            <h2>انتخاب جنگنده ✈️</h2>
            <div class="building-grid" id="fighter-grid"></div>
        </div>
    </div>

    <!-- مودال تغییر نام -->
    <div class="modal-overlay" id="rename-modal">
        <div class="modal-content rename-form">
            <h2>تغییر نام شهردار</h2>
            <input type="text" id="new-name-input" placeholder="نام جدید..." maxlength="15">
            <button id="save-name-btn">ذخیره</button>
        </div>
    </div>

    <!-- مودال ساخت -->
    <div class="modal-overlay" id="build-modal">
        <div class="modal-content">
            <h2>چه ساختمانی بسازیم؟</h2>
            <div class="building-grid" id="building-grid"></div>
        </div>
    </div>

    <!-- مودال حمله -->
    <div class="modal-overlay" id="attack-modal">
        <div class="modal-content">
            <h2>حمله نظامی ⚔️</h2>
            <p>شناسه دشمن را وارد کنید:</p>
            <div class="attack-form">
                <input type="text" id="enemy-id-input" placeholder="شناسه دشمن...">
                <button class="modal-btn btn-action" id="launch-attack-btn" style="background:#c0392b;">شلیک جنگنده (نیاز به پادگان)</button>
            </div>
        </div>
    </div>

    <!-- مودال دوستان -->
    <div class="modal-overlay" id="friends-modal">
        <div class="modal-content">
            <h2>دوستان</h2>
            <div class="friend-form">
                <input type="text" id="friend-id-input" placeholder="شناسه دوست...">
                <button class="modal-btn btn-action" id="add-friend-btn">ارسال درخواست دوستی</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ================= دیتا =================
        const buildingData = [
            { id: 'city_hall', img: 'city_hall.jpeg', price: 50, name: 'شهرداری' },
            { id: 'stadium', img: 'stadium.jpeg', price: 40, name: 'ورزشگاه' },
            { id: 'library', img: 'library.jpeg', price: 30, name: 'کتابخانه' },
            { id: 'abfa', img: 'abfa.jpeg', price: 20, name: 'آبفا' },
            { id: 'military_base', img: 'military_base.jpeg', price: 100, name: 'پادگان نظامی' }
        ];
        const fighters = ['F-16', 'F-22', 'Su-57', 'B-2'];
        const TOTAL_CELLS = 40; // تعداد کل خانه‌ها

        let userCoins = parseInt(localStorage.getItem('shahrdar_coins')) || 100;
        let userId = localStorage.getItem('shahrdar_id');
        let userProfile = localStorage.getItem('shahrdar_profile');
        // آرایه ۴۰ تایی برای ذخیره خانه‌ها
        let cityGrid = JSON.parse(localStorage.getItem('shahrdar_city')) || Array(TOTAL_CELLS).fill(null);
        
        let landLevel = parseInt(localStorage.getItem('shahrdar_land')) || 1;
        let hasWall = localStorage.getItem('shahrdar_wall') === 'true';
        let lastDaily = localStorage.getItem('shahrdar_daily') || 0;

        if (!userId) {
            userId = Math.floor(1000 + Math.random() * 9000).toString();
            localStorage.setItem('shahrdar_id', userId);
        }

        // المان‌ها
        const displayId = document.getElementById('display-id');
        const displayName = document.getElementById('display-name');
        const coinCount = document.getElementById('coin-count');
        const gridContainer = document.getElementById('grid-container');
        const groundContainer = document.getElementById('ground-container');
        const buildModal = document.getElementById('build-modal');
        const buildingGrid = document.getElementById('building-grid');
        const toast = document.getElementById('toast');
        const stoneWall = document.getElementById('stone-wall');
        const profileInfo = document.getElementById('profile-info');
        const renameModal = document.getElementById('rename-modal');
        const newNameInput = document.getElementById('new-name-input');
        const saveNameBtn = document.getElementById('save-name-btn');
        
        const intPanel = document.getElementById('interaction-panel');
        const intTitle = document.getElementById('int-title');
        const intButtons = document.getElementById('int-buttons');
        const closePanelBtn = document.getElementById('close-panel-btn');
        
        const fighterModal = document.getElementById('fighter-modal');
        const fighterGrid = document.getElementById('fighter-grid');

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateUI() {
            displayName.innerText = userProfile || 'شهردار';
            displayId.innerText = userId;
            coinCount.innerText = userCoins;
            if (userProfile) document.getElementById('profile-modal').classList.remove('active');
            if (hasWall) stoneWall.classList.add('active');
            else stoneWall.classList.remove('active');
        }
        updateUI();

        // ================= پروفایل و تغییر نام =================
        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const name = document.getElementById('username-input').value.trim();
            if (name === '') return alert('نام را وارد کنید!');
            userProfile = name;
            localStorage.setItem('shahrdar_profile', userProfile);
            updateUI();
        });

        profileInfo.addEventListener('click', () => {
            if (userProfile) {
                newNameInput.value = userProfile;
                renameModal.classList.add('active');
            }
        });

        saveNameBtn.addEventListener('click', () => {
            const newName = newNameInput.value.trim();
            if (newName === '') return alert('نام را وارد کنید!');
            userProfile = newName;
            localStorage.setItem('shahrdar_profile', userProfile);
            updateUI();
            renameModal.classList.remove('active');
            showToast('نام با موفقیت تغییر کرد!');
        });

        // ================= زمین و شبکه =================
        function applyLandSize() {
            const scale = Math.pow(1.1, landLevel - 1); // رشد ملایم‌تر برای ۴۰ خانه
            groundContainer.style.transform = `translate(-50%, -50%) perspective(800px) rotateX(45deg) scale(${scale})`;
        }
        applyLandSize();

        function drawGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < TOTAL_CELLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.index = i;
                
                if (cityGrid[i]) {
                    const content = document.createElement('div');
                    content.className = 'cell-content';
                    if (cityGrid[i].type === 'grass') {
                        content.classList.add('grass-cell');
                    } else if (cityGrid[i].type === 'street') {
                        content.classList.add('street-cell');
                    } else {
                        content.innerHTML = `<img src="${cityGrid[i].img}" class="building-img" alt="${cityGrid[i].name}">`;
                    }
                    cell.appendChild(content);
                }
                
                cell.addEventListener('click', () => {
                    if (gridContainer.classList.contains('active')) {
                        if (!cityGrid[i]) {
                            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
                            cell.classList.add('selected');
                            window.selectedCellIndex = i;
                        } else {
                            showToast('این خانه پر است!');
                        }
                    }
                });
                gridContainer.appendChild(cell);
            }
        }
        drawGrid();

        // ================= دکمه‌ها =================
        // ساخت
        document.getElementById('hammer-btn').addEventListener('click', () => {
            buildingGrid.innerHTML = '';
            buildingData.forEach((b) => {
                const div = document.createElement('div');
                div.className = 'building-item';
                div.innerHTML = `<img src="${b.img}"><span class="price-tag">${b.price} 🪙</span>`;
                div.onclick = () => {
                    if (userCoins < b.price) return showToast('سکه کافی ندارید!');
                    window.pendingBuilding = b;
                    buildModal.classList.remove('active');
                    gridContainer.classList.add('active');
                    showToast('یک خانه را انتخاب کنید');
                };
                buildingGrid.appendChild(div);
            });
            buildModal.classList.add('active');
        });

        // چمن
        document.getElementById('grass-btn').addEventListener('click', () => {
            if (userCoins < 10) return showToast('برای چمن ۱۰ سکه نیاز دارید!');
            window.pendingBuilding = { type: 'grass', price: 10, name: 'چمن' };
            gridContainer.classList.add('active');
            showToast('یک خانه خالی انتخاب کنید');
        });

        // خیابان
        document.getElementById('street-btn').addEventListener('click', () => {
            if (userCoins < 5) return showToast('برای خیابان ۵ سکه نیاز دارید!');
            window.pendingBuilding = { type: 'street', price: 5, name: 'خیابان' };
            gridContainer.classList.add('active');
            showToast('یک خانه خالی برای خیابان انتخاب کنید');
        });

        // گسترش زمین
        document.getElementById('land-btn').addEventListener('click', () => {
            const cost = 100 * landLevel;
            if (userCoins < cost) return showToast(`به ${cost} سکه نیاز دارید!`);
            userCoins -= cost;
            landLevel++;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_land', landLevel.toString());
            updateUI();
            applyLandSize();
            showToast(`زمین بزرگتر شد! سطح ${landLevel}`);
        });

        // دیوار
        document.getElementById('wall-btn').addEventListener('click', () => {
            if (hasWall) return showToast('شما قبلاً دیوار کشیده‌اید!');
            if (userCoins < 50) return showToast('برای دیوار به ۵۰ سکه نیاز دارید!');
            userCoins -= 50;
            hasWall = true;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_wall', 'true');
            updateUI();
            showToast('دیوار سنگی دور شهر کشیده شد! 🧱');
        });

        // جایزه روزانه
        document.getElementById('daily-btn').addEventListener('click', () => {
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            if (now - lastDaily < oneDay) {
                const hoursLeft = Math.ceil((oneDay - (now - lastDaily)) / (1000 * 60 * 60));
                return showToast(`جایزه بعدی تا ${hoursLeft} ساعت دیگر!`);
            }
            userCoins += 10;
            lastDaily = now;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_daily', now.toString());
            updateUI();
            showToast('جایزه روزانه ۱۰ سکه دریافت شد! 🎁');
        });

        // ثبت ساخت
        gridContainer.addEventListener('click', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (!cell) return;
            const index = parseInt(cell.dataset.index);
            
            if (window.pendingBuilding && !cityGrid[index]) {
                const b = window.pendingBuilding;
                userCoins -= b.price;
                localStorage.setItem('shahrdar_coins', userCoins.toString());
                
                cityGrid[index] = { type: b.type || 'building', img: b.img, name: b.name };
                localStorage.setItem('shahrdar_city', JSON.stringify(cityGrid));
                
                drawGrid();
                updateUI();
                window.pendingBuilding = null;
                gridContainer.classList.remove('active');
                showToast(`${b.name} ساخته شد!`);
            }
        });

        // ================= پنل تعامل با ساختمان =================
        function openInteractionPanel(buildingName, index) {
            intPanel.classList.add('active');
            intTitle.innerText = buildingName;
            intButtons.innerHTML = '';

            // دکمه فروش
            const sellBtn = document.createElement('button');
            sellBtn.className = 'int-btn danger';
            sellBtn.innerText = 'فروش (نصف قیمت)';
            sellBtn.onclick = () => {
                const building = buildingData.find(b => b.name === buildingName);
                if (building) {
                    userCoins += Math.floor(building.price / 2);
                    cityGrid[index] = null;
                    localStorage.setItem('shahrdar_coins', userCoins.toString());
                    localStorage.setItem('shahrdar_city', JSON.stringify(cityGrid));
                    updateUI();
                    drawGrid();
                    intPanel.classList.remove('active');
                    showToast(`${buildingName} فروخته شد!`);
                }
            };
            intButtons.appendChild(sellBtn);

            if (buildingName === 'پادگان نظامی') {
                const fighterBtn = document.createElement('button');
                fighterBtn.className = 'int-btn success';
                fighterBtn.innerText = 'انتخاب جنگنده';
                fighterBtn.onclick = () => {
                    fighterGrid.innerHTML = '';
                    fighters.forEach(f => {
                        const div = document.createElement('div');
                        div.className = 'building-item';
                        div.innerText = f;
                        div.onclick = () => {
                            showToast(`جنگنده ${f} انتخاب شد!`);
                            fighterModal.classList.remove('active');
                            intPanel.classList.remove('active');
                        };
                        fighterGrid.appendChild(div);
                    });
                    fighterModal.classList.add('active');
                };
                intButtons.appendChild(fighterBtn);
            }

            if (buildingName === 'آبفا') {
                const cutBtn = document.createElement('button');
                cutBtn.className = 'int-btn danger';
                cutBtn.innerText = 'قطع آب (+120)';
                cutBtn.onclick = () => {
                    if (confirm('مطمئنید؟ شهروندان ناراضی می‌شوند!')) {
                        userCoins += 120;
                        localStorage.setItem('shahrdar_coins', userCoins.toString());
                        updateUI();
                        showToast('آب قطع شد و ۱۲۰ سکه گرفتید!');
                    }
                };
                intButtons.appendChild(cutBtn);

                const connectBtn = document.createElement('button');
                connectBtn.className = 'int-btn success';
                connectBtn.innerText = 'وصل آب';
                connectBtn.onclick = () => showToast('آب وصل شد!');
                intButtons.appendChild(connectBtn);
            }

            if (buildingName === 'شهرداری') {
                const fireBtn = document.createElement('button');
                fireBtn.className = 'int-btn danger';
                fireBtn.innerText = 'اخراج شهروندان';
                fireBtn.onclick = () => {
                    localStorage.setItem('shahrdar_citizens', 'false');
                    showToast('شهروندان اخراج شدند!');
                    intPanel.classList.remove('active');
                };
                intButtons.appendChild(fireBtn);
            }

            if (buildingName === 'کتابخانه') {
                const bookBtn = document.createElement('button');
                bookBtn.className = 'int-btn success';
                bookBtn.innerText = 'کتاب جدید (-۱)';
                bookBtn.onclick = () => {
                    if (userCoins < 1) return showToast('سکه کافی ندارید!');
                    userCoins -= 1;
                    localStorage.setItem('shahrdar_coins', userCoins.toString());
                    updateUI();
                    showToast('کتاب اضافه شد!');
                };
                intButtons.appendChild(bookBtn);
            }
        }

        closePanelBtn.addEventListener('click', () => {
            intPanel.classList.remove('active');
        });

        // ================= جوی‌استیک و تشخیص نزدیکی =================
        let mayorX = 50, mayorY = 10, isDragging = false;
        const mayor = document.getElementById('mayor-img');
        mayor.style.left = mayorX + '%';
        mayor.style.bottom = mayorY + '%';

        document.getElementById('joystick-container').addEventListener('mousedown', (e) => { isDragging = true; moveKnob(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) moveKnob(e); });
        document.addEventListener('mouseup', () => { isDragging = false; document.getElementById('joystick-knob').style.transform = 'translate(0, 0)'; });
        
        document.getElementById('joystick-container').addEventListener('touchstart', (e) => { isDragging = true; moveKnob(e.touches[0]); e.preventDefault(); });
        document.addEventListener('touchmove', (e) => { if (isDragging) moveKnob(e.touches[0]); });
        document.addEventListener('touchend', () => { isDragging = false; document.getElementById('joystick-knob').style.transform = 'translate(0, 0)'; });

        function moveKnob(event) {
            const container = document.getElementById('joystick-container');
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let deltaX = event.clientX - centerX;
            let deltaY = event.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 30;
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }
            document.getElementById('joystick-knob').style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            
            // حرکت در کل صفحه
            mayorX = 50 + (deltaX / maxRadius) * 50;
            mayorY = 10 - (deltaY / maxRadius) * 30;
            
            if (mayorX < 5) mayorX = 5;
            if (mayorX > 95) mayorX = 95;
            if (mayorY < 5) mayorY = 5;
            if (mayorY > 45) mayorY = 45;
            
            mayor.style.left = mayorX + '%';
            mayor.style.bottom = mayorY + '%';
            
            // بررسی نزدیکی به ساختمان‌ها (تخمینی)
            checkNearbyBuilding();
        }

        function checkNearbyBuilding() {
            // این تابع ساده است، چون محاسبه دقیق مختصات سه بعدی پیچیده است
            // فعلاً برای جلوگیری از پیچیدگی، پنل رو به صورت دستی با کلیک روی خانه‌ها باز می‌کنیم.
            // (در نسخه‌های بعدی می‌تونیم فاصله دقیق رو حساب کنیم)
        }
        
        // بستن پنل با کلیک روی جاهای خالی
        document.getElementById('scene').addEventListener('click', (e) => {
            if (e.target.id === 'scene') {
                intPanel.classList.remove('active');
            }
        });

    </script>
</body>
