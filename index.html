<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شهردار - بازی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- صحنه اصلی (بالای صفحه) -->
    <div class="scene">
        <img src="platform.png" alt="سکو" class="platform-img">
        
        <img src="citizen.png" alt="شهروند" class="char-img citizen">
        <img src="builder.png" alt="سازنده ۱" class="char-img builder" id="builder1">
        <img src="builder.png" alt="سازنده ۲" class="char-img builder" id="builder2">
        <img src="mayor.png" alt="شهردار" class="char-img mayor" id="mayor-img">
        
        <div id="building-spot" class="building-spot"></div>
    </div>

    <!-- کنترل‌های پایین صفحه (شبیه بازی فوتبال) -->
    <div class="controls">
        <!-- دکمه سمت چپ (چرخش یا حرکت) -->
        <div class="control-left">
            <button id="spin-btn" class="action-btn">چرخش</button>
        </div>

        <!-- دکمه‌های سمت راست (ساخت) -->
        <div class="control-right">
            <!-- اینجا می‌تونی دکمه‌های A, B, C رو بذاری -->
            <button class="action-btn secondary">ساخت</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
