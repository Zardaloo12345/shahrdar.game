<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شهردار | بازی استراتژیک شهر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; user-select: none; }
        body {
            background-color: #1a3a5c; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; flex-direction: column; 
        }

        .game-container {
            width: 100%; max-width: 500px; height: 100%; display: flex;
            flex-direction: column; justify-content: space-between; padding-bottom: 20px; position: relative;
        }

        /* نوار بالای صفحه */
        .top-bar {
            position: absolute; top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
            color: white; font-weight: bold; font-size: 14px;
        }
        .profile-info { background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; display: flex; flex-direction: column; align-items: flex-start; }
        .profile-info .name { font-size: 14px; color: #f1c40f; }
        .profile-info .id { font-size: 11px; color: #ccc; }
        
        .coin-info { background: #f1c40f; color: #333; padding: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }

        .top-right-buttons { display: flex; gap: 10px; position: absolute; top: 10px; right: 15px; z-index: 10;}
        .icon-btn { background: rgba(0,0,0,0.4); border: none; color: white; font-size: 20px; padding: 5px 10px; border-radius: 50%; cursor: pointer; }

        /* صحنه بازی */
        .scene { width: 100%; height: 60vh; position: relative; display: flex; justify-content: center; align-items: center; margin-top: 40px; }

        /* زمین سه بعدی */
        .ground-container {
            position: absolute; width: 85%; max-width: 350px; height: 300px;
            top: 50%; left: 50%; transform: translate(-50%, -50%) perspective(800px) rotateX(45deg);
            transition: transform 0.5s ease, width 0.5s ease, height 0.5s ease;
            z-index: 1; 
            background-color: #e0cda9;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            border: 4px solid #b89b58;
        }

        /* شبکه ۳x۳ */
        .grid-container {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            z-index: 2; pointer-events: none;
        }
        .grid-container.active { pointer-events: all; }

        .grid-cell {
            border: 1px dashed rgba(0,0,0,0.1); 
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .grid-cell:hover { background: rgba(255,255,255,0.2); }
        .grid-cell.selected { background: rgba(76, 175, 80, 0.5); border: 2px solid #4CAF50; }

        /* محتویات خانه‌ها */
        .cell-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* تصویر چمن (پسوند jpeg) */
        .cell-content.grass-cell {
            background-image: url('grass.jpeg'); 
            background-size: cover; 
            background-position: center;
        }

        /* ساختمان‌ها */
        .cell-content img.building-img { 
            width: 90%; height: 90%; object-fit: contain; 
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.5));
            mix-blend-mode: multiply;
        }

        /* شخصیت‌ها */
        .char-img { position: absolute; z-index: 5; mix-blend-mode: multiply; transition: all 0.1s linear; }
        .mayor { width: 50px; bottom: 10%; left: 50%; transform: translateX(-50%); }
        #builder1 { width: 40px; bottom: 10%; right: 35%; }
        #builder2 { width: 40px; bottom: 10%; right: 25%; }

        /* کنترل‌ها */
        .controls { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }

        .joystick-container {
            width: 90px; height: 90px; position: relative; display: flex;
            justify-content: center; align-items: center; background: rgba(255,255,255,0.1);
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
        }
        .joystick-knob {
            width: 35px; height: 35px; background: rgba(255,255,255,0.5); border-radius: 50%;
            position: absolute; transition: transform 0.1s ease-out;
        }

        .action-btn-group { display: flex; gap: 10px; }
        .action-btn {
            width: 60px; height: 60px; border-radius: 50%; background-color: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.6); color: white; font-size: 25px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .action-btn:active { transform: scale(0.9); }

        /* مودال‌ها */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px;
            text-align: center; color: #333; max-height: 80vh; overflow-y: auto;
        }

        .modal-content h2 { margin-bottom: 15px; font-size: 18px; }
        .modal-content p { margin-bottom: 10px; }

        .building-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .building-item {
            width: 100%; aspect-ratio: 1; background: #f0f0f0; border-radius: 10px;
            cursor: pointer; padding: 5px; border: 2px solid transparent; transition: all 0.2s;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .building-item:hover { border-color: #1a3a5c; background: #e0e0e0; }
        .building-item img { width: 80%; height: 80%; object-fit: contain; }
        .price-tag {
            position: absolute; bottom: 5px; background: #f1c40f; color: #333;
            font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 10px;
        }

        .modal-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-accept { background-color: #4CAF50; }
        .btn-reject { background-color: #f44336; }
        .btn-action { background-color: #2980b9; width: 100%; margin-top: 10px; }

        .profile-form input, .friend-form input, .attack-form input {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center;
        }
        .profile-form button { width: 100%; padding: 10px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 200;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body id="main-body">
    
    <!-- پروفایل -->
    <div class="modal-overlay active" id="profile-modal">
        <div class="modal-content profile-form">
            <h2>خوش آمدید، شهردار!</h2>
            <input type="text" id="username-input" placeholder="نام شهردار..." maxlength="15">
            <button id="save-profile-btn">شروع بازی (۱۰۰ سکه)</button>
        </div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="profile-info">
                <span class="name" id="display-name">شهردار</span>
                <span class="id">ID: <span id="display-id">---</span></span>
            </div>
            <div class="coin-info">🪙 <span id="coin-count">۱۰۰</span></div>
        </div>
        
        <div class="top-right-buttons" style="position: absolute; top: 10px; right: 15px; z-index: 10;">
            <button class="icon-btn" id="friends-btn">👥</button>
            <button class="icon-btn" id="attack-btn">⚔️</button>
        </div>

        <div class="scene" id="scene">
            <div class="ground-container" id="ground-container">
                <div class="grid-container" id="grid-container"></div>
            </div>

            <img src="mayor.jpg" alt="شهردار" class="char-img mayor" id="mayor-img">
            <img src="builder.jpg" alt="سازنده ۱" class="char-img" id="builder1">
            <img src="builder.jpg" alt="سازنده ۲" class="char-img" id="builder2">
        </div>

        <div class="controls">
            <div class="joystick-container" id="joystick-container">
                <div class="joystick-knob" id="joystick-knob"></div>
            </div>
            <div class="action-btn-group">
                <button id="land-btn" class="action-btn">🌍</button>
                <button id="grass-btn" class="action-btn">🌿</button>
                <button id="hammer-btn" class="action-btn">🔨</button>
            </div>
        </div>
    </div>

    <!-- مودال ساخت -->
    <div class="modal-overlay" id="build-modal">
        <div class="modal-content">
            <h2>چه ساختمانی بسازیم؟</h2>
            <div class="building-grid" id="building-grid"></div>
        </div>
    </div>

    <!-- مودال حمله -->
    <div class="modal-overlay" id="attack-modal">
        <div class="modal-content">
            <h2>حمله نظامی ⚔️</h2>
            <p>شناسه دشمن را وارد کنید:</p>
            <div class="attack-form">
                <input type="text" id="enemy-id-input" placeholder="شناسه دشمن...">
                <button class="modal-btn btn-action" id="launch-attack-btn" style="background:#c0392b;">شلیک جنگنده (نیاز به پادگان)</button>
            </div>
            <p style="font-size: 12px; margin-top: 10px; color: #777;">هر حمله موفق ۱۰ سکه از دشمن کم می‌کند.</p>
        </div>
    </div>

    <!-- مودال دوستان -->
    <div class="modal-overlay" id="friends-modal">
        <div class="modal-content">
            <h2>دوستان</h2>
            <div class="friend-form">
                <input type="text" id="friend-id-input" placeholder="شناسه دوست...">
                <button class="modal-btn btn-action" id="add-friend-btn">ارسال درخواست دوستی</button>
            </div>
            <div id="friends-list" style="text-align: right; font-size: 14px; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ================= دیتا =================
        const buildingData = [
            { id: 'city_hall', img: 'city_hall.jpeg', price: 50, name: 'شهرداری' },
            { id: 'stadium', img: 'stadium.jpeg', price: 40, name: 'ورزشگاه' },
            { id: 'library', img: 'library.jpeg', price: 30, name: 'کتابخانه' },
            { id: 'abfa', img: 'abfa.jpeg', price: 20, name: 'آبفا' },
            { id: 'military_base', img: 'military_base.jpeg', price: 100, name: 'پادگان نظامی' }
        ];

        let userCoins = parseInt(localStorage.getItem('shahrdar_coins')) || 100;
        let userId = localStorage.getItem('shahrdar_id');
        let userProfile = localStorage.getItem('shahrdar_profile');
        let cityGrid = JSON.parse(localStorage.getItem('shahrdar_city')) || Array(9).fill(null);
        let landLevel = parseInt(localStorage.getItem('shahrdar_land')) || 1;

        if (!userId) {
            userId = Math.floor(1000 + Math.random() * 9000).toString();
            localStorage.setItem('shahrdar_id', userId);
        }

        // المان‌ها
        const displayId = document.getElementById('display-id');
        const displayName = document.getElementById('display-name');
        const coinCount = document.getElementById('coin-count');
        const gridContainer = document.getElementById('grid-container');
        const groundContainer = document.getElementById('ground-container');
        const buildModal = document.getElementById('build-modal');
        const buildingGrid = document.getElementById('building-grid');
        const toast = document.getElementById('toast');
        
        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateUI() {
            displayName.innerText = userProfile || 'شهردار';
            displayId.innerText = userId;
            coinCount.innerText = userCoins;
            if (userProfile) document.getElementById('profile-modal').classList.remove('active');
        }
        updateUI();

        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const name = document.getElementById('username-input').value.trim();
            if (name === '') return alert('نام را وارد کنید!');
            userProfile = name;
            localStorage.setItem('shahrdar_profile', userProfile);
            updateUI();
        });

        // ================= زمین و شبکه =================
        function applyLandSize() {
            const scale = Math.pow(1.2, landLevel - 1);
            groundContainer.style.transform = `translate(-50%, -50%) perspective(800px) rotateX(45deg) scale(${scale})`;
        }
        applyLandSize();

        function drawGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.index = i;
                
                if (cityGrid[i]) {
                    const content = document.createElement('div');
                    content.className = 'cell-content';
                    if (cityGrid[i].type === 'grass') {
                        content.classList.add('grass-cell');
                    } else {
                        content.innerHTML = `<img src="${cityGrid[i].img}" class="building-img" alt="${cityGrid[i].name}">`;
                    }
                    cell.appendChild(content);
                }
                
                cell.addEventListener('click', () => {
                    if (gridContainer.classList.contains('active')) {
                        if (!cityGrid[i]) {
                            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
                            cell.classList.add('selected');
                            window.selectedCellIndex = i;
                        } else {
                            showToast('این خانه پر است!');
                        }
                    }
                });
                gridContainer.appendChild(cell);
            }
        }
        drawGrid();

        // ================= دکمه‌ها =================
        // ساخت
        document.getElementById('hammer-btn').addEventListener('click', () => {
            buildingGrid.innerHTML = '';
            buildingData.forEach((b) => {
                const div = document.createElement('div');
                div.className = 'building-item';
                div.innerHTML = `<img src="${b.img}"><span class="price-tag">${b.price} 🪙</span>`;
                div.onclick = () => {
                    if (userCoins < b.price) return showToast('سکه کافی ندارید!');
                    window.pendingBuilding = b;
                    buildModal.classList.remove('active');
                    gridContainer.classList.add('active');
                    showToast('یک خانه را انتخاب کنید');
                };
                buildingGrid.appendChild(div);
            });
            buildModal.classList.add('active');
        });

        // چمن
        document.getElementById('grass-btn').addEventListener('click', () => {
            if (userCoins < 10) return showToast('برای چمن ۱۰ سکه نیاز دارید!');
            window.pendingBuilding = { type: 'grass', price: 10, name: 'چمن' };
            gridContainer.classList.add('active');
            showToast('یک خانه خالی انتخاب کنید');
        });

        // گسترش زمین
        document.getElementById('land-btn').addEventListener('click', () => {
            const cost = 100 * landLevel;
            if (userCoins < cost) return showToast(`به ${cost} سکه نیاز دارید!`);
            userCoins -= cost;
            landLevel++;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_land', landLevel.toString());
            updateUI();
            applyLandSize();
            showToast(`زمین بزرگتر شد! سطح ${landLevel}`);
        });

        // ثبت ساخت
        gridContainer.addEventListener('click', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (!cell) return;
            const index = parseInt(cell.dataset.index);
            
            if (window.pendingBuilding && !cityGrid[index]) {
                const b = window.pendingBuilding;
                userCoins -= b.price;
                localStorage.setItem('shahrdar_coins', userCoins.toString());
                
                cityGrid[index] = { type: b.type || 'building', img: b.img, name: b.name };
                localStorage.setItem('shahrdar_city', JSON.stringify(cityGrid));
                
                drawGrid();
                updateUI();
                window.pendingBuilding = null;
                gridContainer.classList.remove('active');
                showToast(`${b.name} ساخته شد!`);
            }
        });

        // ================= دوستان =================
        document.getElementById('friends-btn').addEventListener('click', () => {
            document.getElementById('friends-modal').classList.add('active');
        });

        document.getElementById('add-friend-btn').addEventListener('click', () => {
            const id = document.getElementById('friend-id-input').value.trim();
            if (id) {
                showToast(`درخواست برای ${id} ارسال شد.`);
                document.getElementById('friend-id-input').value = '';
            }
        });

        // ================= حمله و پادگان =================
        document.getElementById('attack-btn').addEventListener('click', () => {
            document.getElementById('attack-modal').classList.add('active');
        });

        document.getElementById('launch-attack-btn').addEventListener('click', () => {
            const enemyId = document.getElementById('enemy-id-input').value.trim();
            if (!enemyId) return showToast('شناسه دشمن را وارد کنید!');
            
            // چک کردن وجود پادگان در زمین
            let hasBase = cityGrid.some(cell => cell && cell.name === 'پادگان نظامی');
            if (!hasBase) return showToast('ابتدا باید یک پادگان نظامی بسازید!');
            
            if (userCoins < 10) return showToast('برای شلیک جنگنده به ۱۰ سکه نیاز دارید!');

            userCoins -= 10;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            updateUI();
            
            showToast(`حمله موفق! ۱۰ سکه از دشمن (${enemyId}) کم شد.`);
            document.getElementById('attack-modal').classList.remove('active');
            document.getElementById('enemy-id-input').value = '';
        });

        // ================= جوی‌استیک (سرعت زیاد) =================
        let mayorX = 50, mayorY = 10, isDragging = false;
        const mayor = document.getElementById('mayor-img');
        mayor.style.left = mayorX + '%';
        mayor.style.bottom = mayorY + '%';

        document.getElementById('joystick-container').addEventListener('mousedown', (e) => { isDragging = true; moveKnob(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) moveKnob(e); });
        document.addEventListener('mouseup', () => { isDragging = false; document.getElementById('joystick-knob').style.transform = 'translate(0, 0)'; });
        
        document.getElementById('joystick-container').addEventListener('touchstart', (e) => { isDragging = true; moveKnob(e.touches[0]); e.preventDefault(); });
        document.addEventListener('touchmove', (e) => { if (isDragging) moveKnob(e.touches[0]); });
        document.addEventListener('touchend', () => { isDragging = false; document.getElementById('joystick-knob').style.transform = 'translate(0, 0)'; });

        function moveKnob(event) {
            const container = document.getElementById('joystick-container');
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let deltaX = event.clientX - centerX;
            let deltaY = event.clientY - centerY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxRadius = 30;
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }
            document.getElementById('joystick-knob').style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            
            // افزایش سرعت شهردار: ضریب از 10 به 30 تغییر کرد
            mayorX = 50 + (deltaX / maxRadius) * 30;
            mayorY = 10 - (deltaY / maxRadius) * 30;
            if (mayorY < 0) mayorY = 0;
            if (mayorY > 40) mayorY = 40; // اجازه حرکت تا بالای صفحه
            
            mayor.style.left = mayorX + '%';
            mayor.style.bottom = mayorY + '%';
        }
    </script>
</body>
</html>
