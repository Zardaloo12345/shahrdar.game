<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>شهردار | شهر صلح</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        body {
            background: #2c3e50; display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden; 
        }

        /* ================= صفحه بارگذاری ================= */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a3a5c; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }
        .loader-logo { font-size: 60px; margin-bottom: 20px; }
        .loader-title { color: #f1c40f; font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .progress-bar-container { width: 80%; max-width: 300px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #f1c40f; border-radius: 5px; transition: width 0.1s linear; }
        .loading-text { color: white; font-size: 14px; margin-top: 15px; }

        /* ================= بازی ================= */
        .game-container {
            width: 100%; height: 100%; display: flex;
            position: relative; overflow: hidden; 
        }

        /* نوار بالا */
        .top-bar {
            position: absolute; top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 20;
            pointer-events: none;
        }
        
        /* دایره لول */
        .level-ring-container {
            width: 70px; height: 70px; 
            pointer-events: auto;
        }
        .level-ring {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(#4CAF50 0%, #555 0%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative;
            transition: background 0.3s ease;
        }
        .level-ring::before {
            content: ''; position: absolute; width: 80%; height: 80%;
            background: rgba(0,0,0,0.85); border-radius: 50%; z-index: 1;
        }
        .level-text {
            position: relative; z-index: 2; color: white; font-weight: bold; font-size: 20px;
            text-align: center; line-height: 1;
        }
        .level-text span { display: block; font-size: 10px; color: #aaa; margin-top: 2px;}

        /* نمایش سکه */
        .coin-display {
            background: rgba(0,0,0,0.5); border-radius: 20px;
            padding: 8px 15px; display: flex; align-items: center; gap: 5px;
            color: white; font-weight: bold; font-size: 16px;
            margin-right: auto; pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* ================= نقشه ================= */
        .map-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 800px; height: 70%; max-height: 500px;
            border-radius: 15px; border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden; z-index: 1;
            background-image: url('map-background.jpg'); 
            background-size: cover; background-position: center;
        }

        /* ================= نقاط داغ (Hotspots) ================= */
        .hotspot {
            position: absolute; border-radius: 50%; cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        /* مرکز علمی (سبز) */
        #science_center {
            top: 35%; left: 48%; width: 15%; height: 22%;
            background-color: rgba(76, 175, 80, 0.4);
            border: 3px solid #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
        }
        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(76, 175, 80, 0.8); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(76, 175, 80, 1); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(76, 175, 80, 0.8); }
        }
        #science_center { animation: pulse-green 1.5s infinite; }

        /* بانک (آبی) */
        #bank_spot {
            top: 60%; left: 75%; width: 12%; height: 18%;
            background-color: rgba(52, 152, 219, 0.4);
            border: 3px solid #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.8);
        }
        @keyframes pulse-blue {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(52, 152, 219, 0.8); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(52, 152, 219, 1); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(52, 152, 219, 0.8); }
        }
        #bank_spot { animation: pulse-blue 1.5s infinite; }

        .hotspot:hover { filter: brightness(1.2); }

        /* ================= مودال‌ها ================= */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); display: none; 
            justify-content: center; align-items: center; z-index: 100; 
        }
        .modal-overlay.active { display: flex; }

        .modal-content { 
            background: #fff; padding: 25px; border-radius: 15px; 
            width: 90%; max-width: 350px; text-align: center; 
            color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content .building-icon { font-size: 50px; margin-bottom: 10px; }
        .modal-content h2 { margin-bottom: 10px; font-size: 20px; color: #2c3e50; }
        .modal-content p { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.5; }

        /* استایل ورودی بانک */
        .bank-input {
            width: 100%; padding: 10px; font-size: 16px; text-align: center;
            border: 2px solid #3498db; border-radius: 8px; margin-bottom: 15px;
        }
        .bank-input:focus { outline: none; border-color: #2980b9; }

        .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;}
        .modal-btn { 
            padding: 10px 15px; border: none; border-radius: 10px; 
            font-size: 15px; font-weight: bold; cursor: pointer; color: white; 
            flex: 1; transition: transform 0.2s;
        }
        .modal-btn:hover { transform: translateY(-2px); }
        
        .btn-yes { background-color: #4CAF50; }
        .btn-no { background-color: #e74c3c; }
        .btn-deposit { background-color: #3498db; }
        .btn-withdraw { background-color: #f39c12; }
        .btn-close { background-color: #7f8c8d; width: 100%; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 200; }
        .toast.show { opacity: 1; }

        .profile-form input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        .profile-form button { width: 100%; padding: 10px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

    </style>
</head>
<body id="main-body">

    <div id="loading-screen">
        <div class="loader-logo">🏙️</div>
        <div class="loader-title">شهردار | شهر صلح</div>
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="loading-text" id="loading-text">در حال آماده‌سازی نقشه...</div>
    </div>

    <div class="modal-overlay active" id="profile-modal">
        <div class="modal-content profile-form">
            <h2>خوش آمدید، شهردار!</h2>
            <input type="text" id="username-input" placeholder="نام شهردار..." maxlength="15">
            <button id="save-profile-btn">شروع بازی (۱۰۰۰ سکه)</button>
        </div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="level-ring-container">
                <div class="level-ring" id="level-ring">
                    <div class="level-text">
                        <span id="level-display">1</span>
                        <span>LVL</span>
                    </div>
                </div>
            </div>
            
            <div class="coin-display">
                🪙 <span id="coin-count">۱۰۰۰</span>
            </div>
        </div>

        <!-- نقشه -->
        <div class="map-container" id="map-container">
            <!-- مرکز علمی -->
            <div class="hotspot" id="science_center" title="ساخت مرکز علمی"></div>
            
            <!-- بانک (ساختمان جدید) -->
            <div class="hotspot" id="bank_spot" title="ورود به بانک"></div>
        </div>
    </div>

    <!-- مودال تایید ساخت مرکز علمی -->
    <div class="modal-overlay" id="build-confirm-modal">
        <div class="modal-content">
            <div class="building-icon">🔬</div>
            <h2>ساخت مرکز علمی</h2>
            <p>آیا می‌خواهید در این مکان مرکز علمی ساخته شود؟<br><b>هزینه: ۱۰۰ سکه</b></p>
            <div class="modal-buttons">
                <button class="modal-btn btn-yes" id="btn-yes">بله، بساز</button>
                <button class="modal-btn btn-no" id="btn-no">خیر</button>
            </div>
        </div>
    </div>

    <!-- مودال بانک -->
    <div class="modal-overlay" id="bank-modal">
        <div class="modal-content">
            <div class="building-icon">🏦</div>
            <h2>بانک شهر</h2>
            <p>موجودی بانک: <b><span id="bank-balance">0</span></b> سکه</p>
            
            <input type="number" id="bank-amount" class="bank-input" placeholder="مقدار سکه..." min="1">
            
            <div class="modal-buttons">
                <button class="modal-btn btn-deposit" id="btn-deposit">واریز به بانک</button>
                <button class="modal-btn btn-withdraw" id="btn-withdraw">برداشت از بانک</button>
            </div>
            <button class="modal-btn btn-close" id="btn-close-bank">بستن</button>
        </div>
    </div>

    <!-- مودال موفقیت ساخت -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-content">
            <div class="building-icon">🎉</div>
            <h2>ساخته شد!</h2>
            <p>مرکز علمی با موفقیت در شهر ساخته شد.</p>
            <button class="modal-btn btn-yes" id="btn-success-close">عالی!</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let userCoins = parseInt(localStorage.getItem('shahrdar_coins')) || 1000;
        let userLevel = parseInt(localStorage.getItem('shahrdar_level')) || 1;
        let userProfile = localStorage.getItem('shahrdar_profile');
        let isBuilt = localStorage.getItem('shahrdar_science_built') === 'true';
        let bankBalance = parseInt(localStorage.getItem('shahrdar_bank_balance')) || 0; // موجودی بانک

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ================= آپدیت UI =================
        function updateUI() {
            document.getElementById('coin-count').innerText = userCoins;
            document.getElementById('level-display').innerText = userLevel;
            document.getElementById('bank-balance').innerText = bankBalance; // آپدیت موجودی بانک

            // دایره لول
            let progressPercent = (userLevel % 10) * 10; 
            if (progressPercent === 0) progressPercent = 100;
            document.getElementById('level-ring').style.background = `conic-gradient(#4CAF50 ${progressPercent}%, #555 ${progressPercent}%)`;

            if (userProfile) document.getElementById('profile-modal').classList.remove('active');
            
            // تغییر ظاهر مرکز علمی اگر ساخته شده
            if (isBuilt) {
                const hotspot = document.getElementById('science_center');
                hotspot.style.backgroundColor = 'transparent';
                hotspot.style.border = 'none';
                hotspot.style.boxShadow = 'none';
                hotspot.style.animation = 'none';
            }
        }
        updateUI();

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 1000);
        });

        // ================= مرکز علمی =================
        document.getElementById('science_center').addEventListener('click', () => {
            if (isBuilt) return showToast('مرکز علمی قبلاً ساخته شده است!');
            document.getElementById('build-confirm-modal').classList.add('active');
        });

        document.getElementById('btn-no').addEventListener('click', () => {
            document.getElementById('build-confirm-modal').classList.remove('active');
        });

        document.getElementById('btn-yes').addEventListener('click', () => {
            document.getElementById('build-confirm-modal').classList.remove('active');
            if (userCoins < 100) return showToast('سکه کافی ندارید! (نیاز به ۱۰۰ سکه)');

            userCoins -= 100;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_science_built', 'true');
            isBuilt = true;
            
            updateUI();
            document.getElementById('success-modal').classList.add('active');
        });

        document.getElementById('btn-success-close').addEventListener('click', () => {
            document.getElementById('success-modal').classList.remove('active');
        });

        // ================= بانک =================
        // باز کردن بانک
        document.getElementById('bank_spot').addEventListener('click', () => {
            updateUI(); // برای اینکه موجودی بانک آپدیت بشه
            document.getElementById('bank-amount').value = ''; // پاک کردن ورودی
            document.getElementById('bank-modal').classList.add('active');
        });

        // بستن بانک
        document.getElementById('btn-close-bank').addEventListener('click', () => {
            document.getElementById('bank-modal').classList.remove('active');
        });

        // واریز به بانک
        document.getElementById('btn-deposit').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('bank-amount').value);
            
            if (isNaN(amount) || amount <= 0) return showToast('یک مقدار معتبر وارد کنید!');
            if (amount > userCoins) return showToast('موجودی کیف پول شما کافی نیست!');

            userCoins -= amount;
            bankBalance += amount;

            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_bank_balance', bankBalance.toString());
            
            updateUI();
            document.getElementById('bank-amount').value = '';
            showToast(`✅ ${amount} سکه به بانک واریز شد.`);
        });

        // برداشت از بانک
        document.getElementById('btn-withdraw').addEventListener('click', () => {
            const amount = parseInt(document.getElementById('bank-amount').value);
            
            if (isNaN(amount) || amount <= 0) return showToast('یک مقدار معتبر وارد کنید!');
            if (amount > bankBalance) return showToast('موجودی بانک شما کافی نیست!');

            bankBalance -= amount;
            userCoins += amount;

            localStorage.setItem('shahrdar_coins', userCoins.toString());
            localStorage.setItem('shahrdar_bank_balance', bankBalance.toString());
            
            updateUI();
            document.getElementById('bank-amount').value = '';
            showToast(`💸 ${amount} سکه از بانک برداشت شد.`);
        });

        // ================= پروفایل =================
        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const name = document.getElementById('username-input').value.trim();
            if (name === '') return alert('نام را وارد کنید!');
            userProfile = name;
            localStorage.setItem('shahrdar_profile', userProfile);
            updateUI();
        });
    </script>
</body>
</html>
