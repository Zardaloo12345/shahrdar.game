<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>شهردار | شهر صلح</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        body {
            background: #2c3e50; display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden; 
        }

        /* صفحه بارگذاری */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a3a5c; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }
        .loader-logo { font-size: 60px; margin-bottom: 20px; }
        .loader-title { color: #f1c40f; font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .progress-bar-container { width: 80%; max-width: 300px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #f1c40f; border-radius: 5px; transition: width 0.1s linear; }
        .loading-text { color: white; font-size: 14px; margin-top: 15px; }

        /* بازی */
        .game-container {
            width: 100%; height: 100%; display: flex;
            position: relative; overflow: hidden; 
        }

        /* نوار بالا */
        .top-bar {
            position: absolute; top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 20;
            pointer-events: none;
        }
        
        .level-bar {
            background: linear-gradient(to right, #1E88E5, #42A5F5);
            border-radius: 20px; padding: 5px 15px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 3px 0 #1565C0;
            color: white; font-weight: bold; font-size: 14px;
            pointer-events: auto;
        }
        .level-bar .heart { color: #e74c3c; font-size: 16px; }

        .coin-display {
            background: rgba(0,0,0,0.5); border-radius: 20px;
            padding: 5px 15px; display: flex; align-items: center; gap: 5px;
            color: white; font-weight: bold; font-size: 14px;
            margin-right: auto; pointer-events: auto;
        }

        /* نقشه */
        .map-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            z-index: 1;
            background-image: url('map-background.jpg'); 
            background-size: 100% 100%; /* مچ شدن کامل با صفحه */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* نقاط داغ (Hotspots) */
        .hotspot {
            position: absolute;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0);
        }

        .hotspot:hover {
            background-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* مودال */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); display: none; 
            justify-content: center; align-items: center; z-index: 100; 
        }
        .modal-overlay.active { display: flex; }

        .modal-content { 
            background: #fff; padding: 20px; border-radius: 15px; 
            width: 90%; max-width: 400px; text-align: center; 
            color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 { margin-bottom: 10px; font-size: 20px; color: #2c3e50; }
        .modal-content .building-icon { font-size: 60px; margin-bottom: 10px; }
        .modal-content p { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.5; }

        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { 
            padding: 12px; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; color: white; 
        }
        
        .btn-collect { background-color: #4CAF50; }
        .btn-upgrade { background-color: #2980b9; }
        .btn-close { background-color: #e74c3c; margin-top: 5px; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 200; }
        .toast.show { opacity: 1; }

        .profile-form input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        .profile-form button { width: 100%; padding: 10px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

    </style>
</head>
<body id="main-body">

    <div id="loading-screen">
        <div class="loader-logo">🏙️</div>
        <div class="loader-title">شهردار | شهر صلح</div>
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="loading-text" id="loading-text">در حال آماده‌سازی نقشه...</div>
    </div>

    <div class="modal-overlay active" id="profile-modal">
        <div class="modal-content profile-form">
            <h2>خوش آمدید، شهردار!</h2>
            <input type="text" id="username-input" placeholder="نام شهردار..." maxlength="15">
            <button id="save-profile-btn">شروع بازی (۱۰۰۰ سکه)</button>
        </div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="level-bar">
                <span class="heart">❤️</span>
                <span class="lvl-text">سطح <span id="level-display">1</span></span>
            </div>
            <div class="coin-display">
                🪙 <span id="coin-count">۱۰۰۰</span>
            </div>
        </div>

        <!-- نقشه با نقاط داغ -->
        <div class="map-container" id="map-container">
            <!-- ۱. میوه فروشی -->
            <div class="hotspot" id="fruit_stand" style="top: 22%; left: 35%; width: 12%; height: 15%;"></div>
            <!-- ۲. گلخانه -->
            <div class="hotspot" id="greenhouse" style="top: 10%; left: 55%; width: 12%; height: 18%;"></div>
            <!-- ۳. غار -->
            <div class="hotspot" id="cave" style="top: 20%; left: 75%; width: 12%; height: 18%;"></div>
            <!-- ۴. پادگان -->
            <div class="hotspot" id="bunker" style="top: 40%; left: 12%; width: 14%; height: 18%;"></div>
            <!-- ۵. مرکز علمی -->
            <div class="hotspot" id="dome" style="top: 40%; left: 53%; width: 12%; height: 18%;"></div>
            <!-- ۶. سوپرمارکت -->
            <div class="hotspot" id="shop" style="top: 50%; left: 75%; width: 12%; height: 18%;"></div>
            <!-- ۷. بازار سنتی -->
            <div class="hotspot" id="tent" style="top: 55%; left: 32%; width: 14%; height: 20%;"></div>
            <!-- ۸. انبار -->
            <div class="hotspot" id="warehouse" style="top: 70%; left: 58%; width: 12%; height: 18%;"></div>
        </div>
    </div>

    <!-- مودال اطلاعات -->
    <div class="modal-overlay" id="building-modal">
        <div class="modal-content">
            <div class="building-icon" id="modal-icon">🏢</div>
            <h2 id="modal-title">نام ساختمان</h2>
            <p id="modal-desc">توضیحات...</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-collect" id="btn-collect">جمع‌آوری درآمد</button>
                <button class="modal-btn btn-upgrade" id="btn-upgrade">ارتقا</button>
                <button class="modal-btn btn-close" id="btn-close">بستن</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let userCoins = parseInt(localStorage.getItem('shahrdar_coins')) || 1000;
        let userLevel = parseInt(localStorage.getItem('shahrdar_level')) || 1;
        let userProfile = localStorage.getItem('shahrdar_profile');

        const buildingData = {
            fruit_stand: { name: 'میوه‌فروشی', icon: '🍎', desc: 'میوه‌های تازه از باغ‌های اطراف.' },
            greenhouse: { name: 'گلخانه', icon: '🌿', desc: 'پرورش گیاهان کمیاب و تصفیه هوا.' },
            cave: { name: 'غار مرموز', icon: '🦇', desc: 'کسی نمی‌داند درون این غار چیست!' },
            bunker: { name: 'پادگان نظامی', icon: '🛡️', desc: 'تامین‌کننده امنیت شهر.' },
            dome: { name: 'مرکز علمی', icon: '🔬', desc: 'تحقیقات علمی برای پیشرفت شهر.' },
            shop: { name: 'سوپرمارکت', icon: '🛒', desc: 'مایحتاج روزانه شهروندان.' },
            tent: { name: 'بازار سنتی', icon: '⛺', desc: 'صنایع دستی و محصولات محلی.' },
            warehouse: { name: 'انبار بزرگ', icon: '📦', desc: 'ذخیره‌سازی منابع شهر.' }
        };

        let currentBuildingId = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = userCoins;
            document.getElementById('level-display').innerText = userLevel;
            if (userProfile) document.getElementById('profile-modal').classList.remove('active');
        }
        updateUI();

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 1000);
        });

        document.querySelectorAll('.hotspot').forEach(hotspot => {
            hotspot.addEventListener('click', (e) => {
                const id = e.target.id;
                const data = buildingData[id];
                
                if (data) {
                    currentBuildingId = id;
                    document.getElementById('modal-icon').innerText = data.icon;
                    document.getElementById('modal-title').innerText = data.name;
                    document.getElementById('modal-desc').innerText = data.desc;
                    document.getElementById('building-modal').classList.add('active');
                }
            });
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            document.getElementById('building-modal').classList.remove('active');
        });

        document.getElementById('btn-collect').addEventListener('click', () => {
            if (!currentBuildingId) return;
            const income = Math.floor(Math.random() * 20) + 10;
            userCoins += income;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            updateUI();
            showToast(`🎉 ${income} سکه جمع‌آوری شد!`);
            document.getElementById('building-modal').classList.remove('active');
        });

        document.getElementById('btn-upgrade').addEventListener('click', () => {
            if (userCoins < 100) return showToast('به ۱۰۰ سکه نیاز دارید!');
            userCoins -= 100;
            localStorage.setItem('shahrdar_coins', userCoins.toString());
            updateUI();
            showToast('ساختمان ارتقا یافت!');
            document.getElementById('building-modal').classList.remove('active');
        });

        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const name = document.getElementById('username-input').value.trim();
            if (name === '') return alert('نام را وارد کنید!');
            userProfile = name;
            localStorage.setItem('shahrdar_profile', userProfile);
            updateUI();
        });
    </script>
</body>
                                                                                                            </html>
