<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>شهردار | شهر صلح</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background: linear-gradient(135deg, #8ebf56, #a4d16b); display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* لودینگ */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a3a5c; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }
        .loader-logo { font-size: 60px; margin-bottom: 20px; }
        .loader-title { color: #f1c40f; font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .progress-bar-container { width: 80%; max-width: 300px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #f1c40f; border-radius: 5px; transition: width 0.1s linear; }
        .loading-text { color: white; font-size: 14px; margin-top: 15px; }

        .game-container { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 10px; position: relative; overflow: hidden; }
        
        .top-bar { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; color: white; font-weight: bold; font-size: 14px; }
        .profile-info, .coin-info { background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
        .profile-info { cursor: pointer; flex-direction: column; align-items: flex-start; }
        .profile-info .name { font-size: 14px; color: #f1c40f; }
        .profile-info .id { font-size: 11px; color: #ccc; }
        .coin-info { background: #f1c40f; color: #333; }

        .level-ring-container { position: absolute; top: 15px; right: 15px; width: 70px; height: 70px; z-index: 20; }
        .level-ring { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#4CAF50 0%, #555 0%); display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; }
        .level-ring::before { content: ''; position: absolute; width: 80%; height: 80%; background: rgba(0,0,0,0.85); border-radius: 50%; z-index: 1; }
        .level-text { position: relative; z-index: 2; color: white; font-weight: bold; font-size: 18px; text-align: center; }
        .level-text span { display: block; font-size: 10px; color: #aaa; }

        .tool-bar { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .action-btn { width: 50px; height: 50px; border-radius: 50%; background-color: rgba(0,0,0,0.6); border: 2px solid #fff; color: white; font-size: 22px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .action-btn:active { transform: scale(0.9); }

        .scene-wrapper { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; justify-content: center; align-items: center; z-index: 1; overflow: hidden; }
        .ground-container { position: absolute; width: 90%; max-width: 1000px; height: 80%; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 4px solid rgba(255,255,255,0.3); border-radius: 15px; background-color: rgba(0,0,0,0.05); }
        
        .grid-container { position: absolute; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); z-index: 2; gap: 2px; padding: 5px; }
        .grid-cell { border: 1px dashed rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; background: rgba(255,255,255,0.05); }
        .grid-cell:hover { background: rgba(255,255,255,0.2); }
        .grid-cell.selected { background: rgba(76, 175, 80, 0.6); border: 2px solid #4CAF50; }

        .cell-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .brick-stack { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: flex-end; }
        .brick-stack img { position: absolute; width: 70%; height: auto; object-fit: contain; mix-blend-mode: multiply; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); transform: translateY(-5px); }

        .interaction-panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.9); color: white; padding: 15px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; z-index: 50; transition: transform 0.3s ease; display: flex; flex-direction: column; gap: 10px; }
        .interaction-panel.active { transform: translateX(-50%) translateY(0); }
        .interaction-title { font-size: 16px; font-weight: bold; color: #f1c40f; }
        .interaction-buttons { display: flex; gap: 8px; justify-content: center; }
        .int-btn { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; color: white; background: #2980b9; }
        .int-btn.danger { background: #c0392b; }
        .close-panel-btn { background: #555; width: 100%; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; color: #333; max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 15px; font-size: 18px; }

        .building-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; max-height: 60vh; overflow-y: auto; padding: 5px; }
        .building-item { width: 100%; aspect-ratio: 1; background: #f0f0f0; border-radius: 10px; cursor: pointer; padding: 5px; border: 2px solid transparent; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .building-item:hover { border-color: #1a3a5c; background: #e0e0e0; }
        .building-item img { width: 80%; height: 80%; object-fit: contain; }
        .price-tag { position: absolute; bottom: 5px; background: #f1c40f; color: #333; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 10px; }

        .modal-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-accept { background-color: #4CAF50; }
        .btn-reject { background-color: #f44336; }
        .btn-action { background-color: #2980b9; width: 100%; margin-top: 10px; }
        .profile-form input, .rename-form input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }
        .profile-form button, .rename-form button { width: 100%; padding: 10px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 200; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body id="main-body">

    <div id="loading-screen">
        <div class="loader-logo">🏙️</div>
        <div class="loader-title">شهردار | شهر صلح</div>
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="loading-text" id="loading-text">در حال ساخت شهر...</div>
    </div>

    <div class="modal-overlay active" id="profile-modal">
        <div class="modal-content profile-form">
            <h2>خوش آمدید، شهردار!</h2>
            <input type="text" id="username-input" placeholder="نام شهردار..." maxlength="15">
            <button id="save-profile-btn">شروع بازی (۱۰۰۰ سکه)</button>
        </div>
    </div>

    <div class="game-container">
        <div class="top-bar">
            <div class="profile-info" id="profile-info">
                <span class="name" id="display-name">شهردار</span>
                <span class="id">ID: <span id="display-id">---</span></span>
                <button class="delete-account-btn" id="delete-account-btn" style="position:absolute; top:-5px; right:-35px; background:#c0392b; color:white; border:none; border-radius:50%; width:25px; height:25px; cursor:pointer; font-size:12px;">🗑️</button>
            </div>
            <div class="stats-info">
                <div class="coin-info">🪙 <span id="coin-count">۱۰۰۰</span></div>
            </div>
        </div>

        <div class="level-ring-container">
            <div class="level-ring" id="level-ring">
                <div class="level-text"><span id="level-display">1</span><span>LVL</span></div>
            </div>
        </div>
        
        <div class="tool-bar">
            <button id="street-btn" class="action-btn">🛣️</button>
            <button id="wall-btn" class="action-btn">🧱</button>
            <button id="land-btn" class="action-btn">🌍</button>
            <button id="grass-btn" class="action-btn">🌿</button>
            <button id="hammer-btn" class="action-btn">🔨</button>
        </div>

        <div class="scene-wrapper">
            <div class="ground-container">
                <div class="grid-container" id="grid-container"></div>
            </div>
        </div>
    </div>

    <div class="interaction-panel" id="interaction-panel">
        <div class="interaction-title" id="int-title">نام ساختمان</div>
        <div class="interaction-buttons" id="int-buttons"></div>
        <button class="int-btn close-panel-btn" id="close-panel-btn">بستن</button>
    </div>

    <div class="modal-overlay" id="build-modal">
        <div class="modal-content">
            <h2>چه ساختمانی بسازیم؟</h2>
            <div class="building-grid" id="building-grid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="rename-modal">
        <div class="modal-content rename-form">
            <h2>تغییر نام شهردار</h2>
            <input type="text" id="new-name-input" placeholder="نام جدید..." maxlength="15">
            <button id="save-name-btn">ذخیره</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // اجرای بازی بعد از لود کامل
        window.addEventListener('load', () => {
            // بستن صفحه لودینگ با تاخیر
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                // نمایش پیام خوش‌آمدگویی
                const profileModal = document.getElementById('profile-modal');
                if (profileModal) profileModal.classList.add('active');
            }, 2000); // ۲ ثانیه صبر می‌کنه بعد میره
        });

        // ================= متغیرها =================
        let TOTAL_CELLS = 25; 
        let currentCols = 5;
        let currentRows = 5;
        let userCoins = parseInt(localStorage.getItem('shahrdar_coins')) || 1000;
        let userId = localStorage.getItem('shahrdar_id');
        let userProfile = localStorage.getItem('shahrdar_profile');
        let cityGrid = JSON.parse(localStorage.getItem('shahrdar_city')) || Array(TOTAL_CELLS).fill(null);
        let landLevel = parseInt(localStorage.getItem('shahrdar_land')) || 1;
        let userLevel = parseInt(localStorage.getItem('shahrdar_level')) || 1;
        let userXP = parseInt(localStorage.getItem('shahrdar_xp')) || 0;
        let xpNeeded = userLevel * 100;

        if (!userId) {
            userId = Math.floor(1000 + Math.random() * 9000).toString();
            localStorage.setItem('shahrdar_id', userId);
        }

        // ================= توابع =================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateUI() {
            document.getElementById('display-name').innerText = userProfile || 'شهردار';
            document.getElementById('display-id').innerText = userId;
            document.getElementById('coin-count').innerText = userCoins;
            document.getElementById('level-display').innerText = userLevel;
            
            const progressPercent = (userXP / xpNeeded) * 100;
            document.getElementById('level-ring').style.background = `conic-gradient(#4CAF50 ${progressPercent}%, #555 ${progressPercent}%)`;
        }

        function addXP(amount) {
            userXP += amount;
            while (userXP >= xpNeeded) {
                userXP -= xpNeeded;
                userLevel++;
                xpNeeded = userLevel * 100;
                userCoins += 500;
                localStorage.setItem('shahrdar_level', userLevel.toString());
                localStorage.setItem('shahrdar_xp', userXP.toString());
                localStorage.setItem('shahrdar_coins', userCoins.toString());
                showToast(`🎉 لول آپ! شما به لول ${userLevel} رسیدید و ۵۰۰ سکه گرفتید!`);
            }
            localStorage.setItem('shahrdar_xp', userXP.toString());
            updateUI();
        }

        // ================= ساختمان‌ها =================
        const buildingData = [
            { img: 'stadium.jpg', price: 40, name: 'ورزشگاه', xp: 25 },
            { img: 'hospital.jpg', price: 60, name: 'بیمارستان', xp: 35 },
            { img: 'school.jpg', price: 30, name: 'مدرسه', xp: 20 },
            { img: 'mall.jpg', price: 70, name: 'مرکز خرید', xp: 40 },
            { img: 'office.jpg', price: 50, name: 'ساختمان اداری', xp: 30 },
            { img: 'fire_station.jpg', price: 45, name: 'آتش‌نشانی', xp: 25 },
            { img: 'police.jpg', price: 45, name: 'پلیس', xp: 25 },
            { img: 'gov_building.jpg', price: 80, name: 'دولتی', xp: 45 },
            { img: 'mosque.jpg', price: 35, name: 'مسجد', xp: 20 },
            { img: 'church.jpg', price: 35, name: 'کلیسا', xp: 20 },
            { img: 'apartment.jpg', price: 55, name: 'مجتمع مسکونی', xp: 30 },
            { img: 'hotel.jpg', price: 65, name: 'هتل', xp: 35 },
            { img: 'bank.jpg', price: 50, name: 'بانک', xp: 30 },
            { img: 'post_office.jpg', price: 25, name: 'اداره پست', xp: 15 },
            { img: 'library.jpg', price: 30, name: 'کتابخانه', xp: 20 },
            { img: 'factory.jpg', price: 75, name: 'کارخانه', xp: 45 },
            { img: 'warehouse.jpg', price: 40, name: 'انبار', xp: 25 },
            { img: 'supermarket.jpg', price: 35, name: 'سوپرمارکت', xp: 20 },
            { img: 'park.jpg', price: 20, name: 'پارک', xp: 10 },
            { img: 'cinema.jpg', price: 60, name: 'سینما', xp: 35 },
            { img: 'power_plant.jpg', price: 90, name: 'نیروگاه', xp: 50 },
            { img: 'water_treatment.jpg', price: 85, name: 'تصفیه آب', xp: 45 },
            { img: 'waste_water.jpg', price: 80, name: 'تصفیه فاضلاب', xp: 45 },
            { img: 'airport.jpg', price: 120, name: 'فرودگاه', xp: 60 },
            { img: 'port.jpg', price: 110, name: 'بندر', xp: 55 }
        ];

        // ================= رسم شبکه =================
        function drawGrid() {
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            gridContainer.style.gridTemplateColumns = `repeat(${currentCols}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${currentRows}, 1fr)`;
            
            for (let i = 0; i < TOTAL_CELLS; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.index = i;
                
                if (cityGrid[i]) {
                    const content = document.createElement('div');
                    content.className = 'cell-content';
                    if (cityGrid[i].type === 'grass') {
                        content.style.backgroundImage = "url('grass.jpg')";
                        content.style.backgroundSize = 'cover';
                    } else {
                        let brickHtml = '<div class="brick-stack">';
                        for(let j=0; j<10; j++) {
                            const left = Math.random() * 20 - 10;
                            const bottom = j * 3;
                            brickHtml += `<img src="brick.jpg" style="left: ${left}%; bottom: ${bottom}%;" alt="brick">`;
                        }
                        brickHtml += '</div>';
                        content.innerHTML = brickHtml;
                    }
                    cell.appendChild(content);
                }
                
                cell.addEventListener('click', () => {
                    if (gridContainer.classList.contains('active')) {
                        if (!cityGrid[i]) {
                            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
                            cell.classList.add('selected');
                            window.selectedCellIndex = i;
                        } else {
                            showToast('این خانه پر است!');
                        }
                    }
                });
                gridContainer.appendChild(cell);
            }
        }

        // ================= دکمه ساخت =================
        document.getElementById('hammer-btn').addEventListener('click', () => {
            const buildingGrid = document.getElementById('building-grid');
            buildingGrid.innerHTML = '';
            buildingData.forEach((b) => {
                const div = document.createElement('div');
                div.className = 'building-item';
                div.innerHTML = `<img src="${b.img}"><span class="price-tag">${b.price} 🪙</span>`;
                div.onclick = () => {
                    if (userCoins < b.price) return showToast('سکه کافی ندارید!');
                    window.pendingBuilding = b;
                    document.getElementById('build-modal').classList.remove('active');
                    document.getElementById('grid-container').classList.add('active');
                    showToast('یک خانه را انتخاب کنید');
                };
                buildingGrid.appendChild(div);
            });
            document.getElementById('build-modal').classList.add('active');
        });

        // کلیک روی خانه برای ساخت
        document.getElementById('grid-container').addEventListener('click', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (!cell) return;
            const index = parseInt(cell.dataset.index);
            
            if (window.pendingBuilding && !cityGrid[index]) {
                const b = window.pendingBuilding;
                userCoins -= b.price;
                localStorage.setItem('shahrdar_coins', userCoins.toString());
                
                cityGrid[index] = { type: 'building', img: b.img, name: b.name };
                localStorage.setItem('shahrdar_city', JSON.stringify(cityGrid));
                
                drawGrid();
                updateUI();
                addXP(b.xp || 10);
                
                window.pendingBuilding = null;
                document.getElementById('grid-container').classList.remove('active');
                document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
                
                showToast(`${b.name} ساخته شد!`);
            }
        });

        // ================= شروع =================
        drawGrid();
        updateUI();
    </script>
</body>
    </html>
